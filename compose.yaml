services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jekro
      POSTGRES_PASSWORD: jekro_dev_password
      POSTGRES_DB: jekro
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jekro -d jekro"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: